<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Quest - Mapa</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&family=Russo+One&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body class="logic-body">

    <header class="logic-header">
        <a href="../../../index.html" class="btn-icon">✖</a>
        <div class="level-badge">🏆 Nível: <span id="level-text">1/16</span></div>
    </header>

    <main class="map-area">
        <div class="map-container">
            <img src="../../imgs/fundo3.png" alt="Mapa de Lógica" class="map-image">

            <div id="robot-marker" class="robot-marker">
                <div id="robot-speech" class="speech-bubble" style="opacity: 0;">
                    <p id="speech-text"></p>
                    <div class="bubble-arrow"></div>
                </div>

                <div class="robot-icon" id="robot-btn" title="Clique para o desafio!">
                    🤖
                    <div class="robot-ping"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="intro-overlay" class="quiz-overlay">
        <div class="quiz-modal intro-modal">
            <div class="modal-glow"></div>

            <div class="quiz-header">
                <div class="quiz-title">
                    <div class="robot-icon-mini">🤖</div>
                    <h3>SISTEMA INICIALIZADO</h3>
                </div>
            </div>

            <div class="intro-content">
                <p id="intro-text" class="question-text"></p>
            </div>

            <div class="intro-footer">
                <button id="btn-start-game" class="btn-desafio"
                    style="width: 100%; opacity: 0; transition: opacity 0.5s;">
                    ESTOU PRONTO!
                </button>
            </div>
        </div>
    </div>

    <div id="quiz-overlay" class="quiz-overlay" style="display: none;">
        <div class="quiz-modal">
            <div class="modal-glow"></div>
            <div class="quiz-header">
                <div class="quiz-title">
                    <span class="icon-code">💻</span>
                    <h3>DESAFIO</h3>
                </div>
                <button id="close-quiz" class="btn-close-modal">✖</button>
            </div>
            <p id="question-text" class="question-text"></p>
            <div id="options-container" class="options-container"></div>
        </div>
    </div>

    <script src="../../js/questions.js"></script>
    <script src="../../js/logic.js"></script>
</body>

</html>
